[models]
default_local = Qwen/Qwen3-8B
whisper = base

[hosts]
bridge = 127.0.0.1
vllm = 127.0.0.1
moos = localhost

[ports]
bridge = 5055
vllm = 8001
moos_base = 9100
pshare_base = 9200

[llm]
api_key = local-vllm
max_model_len = 8192
officer_max_output_tokens = 2048

[runtime]
poll_seconds = 10
bridge_timeout_seconds = 3
officer_stale_after_seconds = 15
startup_timeout_seconds = 120
# Model loading and LoRA CUDA graph capture need a separate startup budget.
vllm_startup_timeout_seconds = 600
time_warp = 1

[mission]
directory = mission
fleet_config = scenarios/open_waters/fleet.ini
own_ship_vehicle_index = 1

[paths]
runtime_logs = logs

[maib_rag]
# Toggle for paired baseline/RAG experiments. An absent index retrieves nothing.
enabled = true
# When enabled, the OOW recommendation is reviewed by a captain model that sees
# retrieved MAIB investigation reasoning before selecting the executable action.
captain_decision_enabled = true
index_path = accidents/index.jsonl
top_k = 2
min_score = 5.0
embeddings_path = accidents/embeddings.npy
embedding_model = BAAI/bge-small-en-v1.5
# Leave blank until the reranking experiment justifies its latency.
reranker_model =

[vhf]
# Keep ASR off the GPU reserved by vLLM. VHF clips are short and intermittent;
# CPU int8 is slower than CUDA but avoids competing with the navigation model.
device = cpu
compute_type = int8
minimum_confidence = 0.80
input_dir = audio/vhf_inbox
processed_dir = audio/vhf_processed
failed_dir = audio/vhf_failed

[lookout]
stale_after_s = 5
max_output_tokens = 512
immediate_watch_range_m = 300

[oow]
# Both comparison conditions use agents/skills/oow_decision.md. The runtime
# launcher changes only the requested model (base model or this LoRA adapter).
finetuned_model_name = oow-finetuned
adapter_path = models/qwen3_8b_oow_colregs_qlora
history_size = 3
max_history_gap_s = 120

[ship]
DEFAULT_MANEUVER_DISTANCE_M = 500.0
# Course alterations use a short temporary waypoint; the mission route resumes
# automatically when that waypoint is reached.
MIN_MANEUVER_SPEED = 0.3
MAX_MANEUVER_DISTANCE_M = 450.0
# Training/evaluation clearance envelope. Tactical action should preserve at
# least the same 500 m separation used by the frozen SFT quality gate; the
# smaller CRITICAL_CPA_M remains the emergency boundary.
MIN_SAFE_CPA_M = 500.0
CAUTION_CPA_M = 300.0
CRITICAL_CPA_M = 150.0
PLANNING_TCPA_S = 600.0
INTERVENTION_TCPA_S = 300.0
EMERGENCY_TCPA_S = 120.0

[imazu]
# Sawada et al. (2021): 0.5 NM safe passing distance and a 1.0 NM
# forward/bow-crossing domain. Applied by run_simulator.sh only to Imazu cases.
# Time acceleration changes wall-clock duration, not simulated vessel speeds.
TIME_WARP = 10
SAFE_PASSING_DISTANCE_M = 926.0
BOW_CROSSING_DISTANCE_M = 1852.0
CAUTION_DISTANCE_M = 1852.0
CRITICAL_DISTANCE_M = 555.6
# Keep a substantial Imazu avoidance alteration active for one nautical mile.
# The previous 0.3-NM leg completed before crossing traffic had passed and
# repeatedly dropped the ship back onto the conflicting mission route.
MANEUVER_DISTANCE_M = 1852.0

[colregs]
# MOOS-IvP has no meteorological visibility model. Contacts within this range
# are treated as mutually visible for Rules 11-18 in the simulation.
visibility_range_m = 10000
visibility_condition = clear
# Scenario-wide assumptions until chart/environment layers expose these facts.
narrow_channel = false
traffic_separation_scheme = false
# Shadow mode records verdicts but never suppresses a command.
mode = shadow
max_output_tokens = 1024

[outcomes]
# Observed center-to-center separation. Collision approximates one simulated
# hull length; near collision is diagnostic and does not terminate the run.
collision_distance_m = 10
near_collision_distance_m = 50
