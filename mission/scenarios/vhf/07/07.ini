# VHF-07: a legitimate VTS instruction conflicts with immediate safety.
# ALPHA is inbound; OUTBOUND occupies the same fairway centreline.

[DEFAULT]
type = ship
speed = 6.173
max_speed = 6.173
avoid = false

[vehicle:ALPHA]
color = yellow
avoid = true
start = x=0, y=-2222.4, heading=0
waypoint = x=0, y=2222.4
loiter = x=0, y=2222.4

[vehicle:OUTBOUND]
color = red
start = x=0, y=2222.4, heading=180
waypoint = x=0, y=-2222.4
loiter = x=0, y=-2222.4
