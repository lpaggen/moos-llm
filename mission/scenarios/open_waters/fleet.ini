# Fleet configuration for the crossing mission.
#
# A plain ./launch.sh launches every enabled vehicle. To launch only the first
# N enabled vehicles, use: ./launch.sh --amt=N 5
#
# Add another ship by copying a [vehicle:NAME] section. Section order is
# launch order; network defaults are defined in project.ini at the repository root.
#
# Use `waypoints = x=..., y=...; x=..., y=...` to define a multi-leg route.
# A single `waypoint = ...` still works for one-leg routes.

[DEFAULT]
type = ship
color = white
speed = 20
max_speed = 20

[vehicle:LLM_SHIP]
type = ship
color = yellow
speed = 20
start = x=-665, y=-7650, heading=-15
waypoint = x=-665, y=-7550; x=-850, y=-6957; x=-226, y=-5429; x=258, y=-2637; x=12, y=-2084; x=-415, y=-2049; x=-442, y=-2107
loiter = x=-60, y=-45
fast_start = x=-60, y=0, heading=90
fast_waypoint = x=60, y=0
fast_loiter = x=-45, y=-35

[vehicle:FERRY]
type = ship
color = red
speed = 20
start = x=-1500, y=-6756, heading=15
waypoint = x=-1300, y=-6459; x=-1162, y=-6015; x=-1055, y=-4969; x=-1013, y=-4091; x=-1010, y=-2735; x=-1220, y=-2415
loiter = x=45, y=-60
fast_start = x=0, y=-60, heading=0
fast_waypoint = x=0, y=60
fast_loiter = x=35, y=-45

# ---------------------------------------------------------------------------
# Additional realistic Marsdiep traffic
#
# These are synthetic traffic patterns for simulation, not navigation routes.
# Routes are based on the same local metre coordinate system as LLM_SHIP/FERRY.
# ---------------------------------------------------------------------------

# Texel -> Den Helder ferry.
# Reverse of the existing FERRY route, with slightly separated intermediate
# points so the ferries do not drive exactly through one another.
[vehicle:FERRY_RETURN]
type = ship
color = orange
speed = 10
max_speed = 12
start = x=-1221, y=-2416, heading=190
waypoint = x=-1190, y=-2750; x=-1025, y=-4100; x=-1065, y=-5000; x=-1175, y=-6000; x=-1325, y=-6500; x=-1500, y=-6756
loiter = x=-1500, y=-6756


# Larger ship leaving the Marsdiep for the North Sea.
# Approximately the reverse traffic stream of LLM_SHIP.
[vehicle:OUTBOUND_1]
type = ship
color = cyan
speed = 16
max_speed = 20
start = x=-442, y=-2107, heading=190
waypoint = x=-415, y=-2049; x=12, y=-2084; x=258, y=-2637; x=-226, y=-5429; x=-850, y=-6957; x=-665, y=-7550
loiter = x=-665, y=-7650


# Second outbound ship. Slight lateral separation prevents the traffic from
# looking like vehicles following a rail.
[vehicle:OUTBOUND_2]
type = ship
color = light_blue
speed = 13
max_speed = 18
start = x=-360, y=-2025, heading=200
waypoint = x=-300, y=-2125; x=75, y=-2180; x=180, y=-2750; x=-315, y=-5450; x=-930, y=-7000; x=-760, y=-7700
loiter = x=-760, y=-7700


# Another inbound vessel using the Schulpengat/Marsdiep stream.
[vehicle:INBOUND_2]
type = ship
color = magenta
speed = 14
max_speed = 18
start = x=-820, y=-7700, heading=-10
waypoint = x=-810, y=-7300; x=-970, y=-6900; x=-350, y=-5400; x=170, y=-2700; x=-20, y=-2180; x=-390, y=-2110
