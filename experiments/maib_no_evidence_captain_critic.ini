[models]
default_local = Qwen/Qwen3-8B
whisper = base

[hosts]
bridge = 127.0.0.1
vllm = 127.0.0.1
moos = localhost

[ports]
bridge = 5055
vllm = 8001
moos_base = 9100
pshare_base = 9200

[llm]
api_key = local-vllm
max_model_len = 8192
officer_max_output_tokens = 2048

[runtime]
poll_seconds = 10
bridge_timeout_seconds = 3
officer_stale_after_seconds = 15
startup_timeout_seconds = 120
vllm_startup_timeout_seconds = 600
time_warp = 1

[mission]
directory = mission
fleet_config = scenarios/open_waters/fleet.ini
own_ship_vehicle_index = 1

[paths]
runtime_logs = logs

[maib_rag]
# Captain/lookahead ablation: keep the identical critic architecture but force
# retrieval to return zero documents. This isolates evidence from critic value.
enabled = true
captain_decision_enabled = true
index_path = accidents/cards/index.jsonl
top_k = 0
min_score = 5.0
embeddings_path = accidents/cards/embeddings.npy
embedding_model = BAAI/bge-small-en-v1.5
reranker_model =

[vhf]
device = cpu
compute_type = int8
minimum_confidence = 0.80
input_dir = audio/vhf_inbox
processed_dir = audio/vhf_processed
failed_dir = audio/vhf_failed

[lookout]
stale_after_s = 5
max_output_tokens = 1024
immediate_watch_range_m = 300

[oow]
finetuned_model_name = oow-finetuned
adapter_path = models/qwen3_8b_oow_colregs_qlora
history_size = 3
max_history_gap_s = 120

[ship]
DEFAULT_MANEUVER_DISTANCE_M = 500.0
MIN_MANEUVER_SPEED = 0.3
MAX_MANEUVER_DISTANCE_M = 450.0
MIN_SAFE_CPA_M = 150.0
CAUTION_CPA_M = 300.0
CRITICAL_CPA_M = 150.0
PLANNING_TCPA_S = 600.0
INTERVENTION_TCPA_S = 300.0
EMERGENCY_TCPA_S = 120.0

[imazu]
TIME_WARP = 10
SAFE_PASSING_DISTANCE_M = 926.0
BOW_CROSSING_DISTANCE_M = 1852.0
CAUTION_DISTANCE_M = 1852.0
CRITICAL_DISTANCE_M = 555.6
MANEUVER_DISTANCE_M = 1852.0

[colregs]
visibility_range_m = 10000
visibility_condition = clear
narrow_channel = false
traffic_separation_scheme = false
mode = shadow
max_output_tokens = 1024

[outcomes]
collision_distance_m = 10
near_collision_distance_m = 50
